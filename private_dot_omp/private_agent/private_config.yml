symbolPreset: nerd
theme: 
  dark: dark-dracula
  light: light
setupVersion: 1
statusLine: 
  showHookStatus: true
  preset: custom
  separator: powerline-thin
  sessionAccent: true
  transparent: false
  leftSegments: 
    - model
    - path
    - git
  rightSegments: 
    - context_pct
    - cost
  compactThinkingLevel: true
tui: 
  textSizing: false
  tight: true
  renderMermaid: true
  hyperlinks: auto
display: 
  shimmer: classic
  showTokenUsage: true
startup: 
  quiet: true
  showSplash: false
  changelogMode: summary
task: 
  showResolvedModelBadge: true
  eager: default
  maxRecursionDepth: 1
  maxConcurrency: 32
  softRequestBudgetNotice: true
modelRoles: 
  commit: lm-studio/lfm2.5-2.6b:off
  tiny: lm-studio/lfm2.5-2.6b:off
  advisor: opencode-go/deepseek-v4-flash:off
  default: opencode-go/deepseek-v4-flash:off
advisor: 
  enabled: true
  syncBacklog: "1"
hideThinkingBlock: true
doubleEscapeAction: tree
treeFilterMode: no-tools
branchSummary: 
  enabled: false
exa: 
  enabled: true
providers: 
  tinyModel: online
  memoryModel: online
  streamFirstEventTimeoutSeconds: 300
  streamIdleTimeoutSeconds: 300
  webSearchOrder: 
    - brave
    - perplexity
    - gemini
    - anthropic
    - codex
    - xai
    - zai
    - exa
    - tinyfish
    - jina
    - kagi
    - tavily
    - firecrawl
    - kimi
    - parallel
    - synthetic
    - searxng
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek
    - public
python: 
  kernelMode: session
completion: 
  notify: "on"
power: 
  sleepPrevention: "off"
features: 
  unexpectedStopDetection: true
tools: 
  approvalMode: yolo
  approval: 
    bash: allow
    edit: allow
    write: allow
    read: allow
    task: allow
memory: 
  backend: "off"
autolearn: 
  enabled: false
github: 
  enabled: true
secrets: 
  enabled: true
colorBlindMode: false
terminal: 
  showProgress: false
todo: 
  enabled: false
  reminders: false
browser: 
  enabled: false
plan: 
  enabled: true
skills: 
  enableSkillCommands: true
commands: 
  enableClaudeUser: true
  enableClaudeProject: true
  enableOpencodeUser: true
  enableOpencodeProject: true
compaction: 
  thresholdTokens: 300000
  idleEnabled: true
  idleThresholdTokens: 200000
marketplace: 
  autoUpdate: auto
edit: 
  mode: hashline
dev: 
  autoqaConsent: granted
retry: 
  fallbackChains: 
    advisor: 
      - opencode-go/deepseek-v4-flash
cycleOrder: 
  - default
includeWorkspaceTree: true
bashInterceptor: 
  enabled: false
astGrep: 
  enabled: true
generate_image: 
  enabled: false
web_search: 
  enabled: true
