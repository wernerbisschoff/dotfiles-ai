# Gemini CLI Policy Configuration
# Mirrors permissions from ~/.claude/settings.json

# ===========================================
# ALLOW - Commands that are permitted without prompting
# ===========================================

# Git read operations (safe, non-destructive)
[[rule]]
toolName = "run_shell_command"
decision = "allow"
priority = 100
commandPrefix = ["git", "--no-pager"]

[[rule]]
toolName = "run_shell_command"
decision = "allow"
priority = 100
commandPrefix = ["git", "checkout", "-b"]

[[rule]]
toolName = "run_shell_command"
decision = "allow"
priority = 100
commandPrefix = ["git", "branch"]

[[rule]]
toolName = "run_shell_command"
decision = "allow"
priority = 100
commandPrefix = ["git", "log"]

[[rule]]
toolName = "run_shell_command"
decision = "allow"
priority = 100
commandPrefix = ["git", "show"]

[[rule]]
toolName = "run_shell_command"
decision = "allow"
priority = 100
commandPrefix = ["git", "status"]

[[rule]]
toolName = "run_shell_command"
decision = "allow"
priority = 100
commandPrefix = ["git", "diff"]

[[rule]]
toolName = "run_shell_command"
decision = "allow"
priority = 100
commandPrefix = ["git", "remote", "get-url"]

[[rule]]
toolName = "run_shell_command"
decision = "allow"
priority = 100
commandPrefix = ["git", "submodule", "status"]

# Git write operations (committed changes)
[[rule]]
toolName = "run_shell_command"
decision = "allow"
priority = 100
commandPrefix = ["git", "add"]

[[rule]]
toolName = "run_shell_command"
decision = "allow"
priority = 100
commandPrefix = ["git", "commit"]

# GitHub CLI read operations
[[rule]]
toolName = "run_shell_command"
decision = "allow"
priority = 100
commandPrefix = ["gh", "auth", "status"]

[[rule]]
toolName = "run_shell_command"
decision = "allow"
priority = 100
commandPrefix = ["gh", "api", "--GET"]

[[rule]]
toolName = "run_shell_command"
decision = "allow"
priority = 100
commandPrefix = ["gh", "api", "-X", "GET"]

[[rule]]
toolName = "run_shell_command"
decision = "allow"
priority = 90
commandPrefix = ["gh", "api", "graphql"]

[[rule]]
toolName = "run_shell_command"
decision = "allow"
priority = 100
commandPrefix = ["gh", "pr", "list"]

[[rule]]
toolName = "run_shell_command"
decision = "allow"
priority = 100
commandPrefix = ["gh", "pr", "view"]

[[rule]]
toolName = "run_shell_command"
decision = "allow"
priority = 100
commandPrefix = ["gh", "repo", "view"]

[[rule]]
toolName = "run_shell_command"
decision = "allow"
priority = 100
commandPrefix = ["gh", "run", "list"]

[[rule]]
toolName = "run_shell_command"
decision = "allow"
priority = 100
commandPrefix = ["gh", "run", "view"]

[[rule]]
toolName = "run_shell_command"
decision = "allow"
priority = 100
commandPrefix = ["gh", "run", "watch"]

# File system operations
[[rule]]
toolName = "run_shell_command"
decision = "allow"
priority = 100
commandPrefix = ["ls"]

[[rule]]
toolName = "run_shell_command"
decision = "allow"
priority = 100
commandPrefix = ["mkdir", "-p"]

[[rule]]
toolName = "run_shell_command"
decision = "allow"
priority = 100
commandPrefix = ["make"]


# Custom scripts
[[rule]]
toolName = "run_shell_command"
decision = "allow"
priority = 100
commandPrefix = ["~/.claude/scripts/gh-repo-info.sh"]

# Web search capability
[[rule]]
toolName = "web_search"
decision = "allow"
priority = 100

# ===========================================
# ASK - Commands that require user confirmation
# ===========================================

# Dangerous git operations
[[rule]]
toolName = "run_shell_command"
decision = "ask_user"
priority = 150
commandPrefix = ["git", "add", "."]

[[rule]]
toolName = "run_shell_command"
decision = "ask_user"
priority = 150
commandPrefix = ["git", "add", "-A"]

[[rule]]
toolName = "run_shell_command"
decision = "ask_user"
priority = 150
commandPrefix = ["git", "add", "-u"]

# File deletion
[[rule]]
toolName = "run_shell_command"
decision = "ask_user"
priority = 150
commandPrefix = ["rm"]
